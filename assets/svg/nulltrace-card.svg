<svg width="390" height="185" viewBox="0 0 390 185" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Outfit:wght@400;600;700&amp;display=swap');
            text {
                font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            }
            .mono {
                font-family: 'Fira Code', monospace;
            }
            .card-border {
                stroke: url(#border-grad-NullTrace);
                stroke-width: 1.5;
            }
        </style>
        
        <linearGradient id="bg-NullTrace" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0a0f" />
            <stop offset="100%" stop-color="#161b22" />
        </linearGradient>
        
        <radialGradient id="glow-NullTrace" cx="0%" cy="0%" r="60%">
            <stop offset="0%" stop-color="#a371f7" stop-opacity="0.15" />
            <stop offset="100%" stop-color="rgba(0,0,0,0)" />
        </radialGradient>
        
        <linearGradient id="border-grad-NullTrace" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a371f7" />
            <stop offset="40%" stop-color="#30363d" />
            <stop offset="100%" stop-color="#161b22" />
        </linearGradient>
        
        <!-- Grid pattern inside cards -->
        <pattern id="card-dot-grid" width="14" height="14" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.6" fill="rgba(255,255,255,0.04)" />
        </pattern>
    </defs>
    
    <!-- Card Frame -->
    <rect width="390" height="185" rx="12" fill="url(#bg-NullTrace)" class="card-border" />
    <rect width="390" height="185" rx="12" fill="url(#card-dot-grid)" />
    <rect width="390" height="185" rx="12" fill="url(#glow-NullTrace)" style="pointer-events: none;" />
    
    <!-- Rotating Logo container -->
    <g transform="translate(42, 42)">
        <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <g>
            
    <path d="M-6,4 L6,10 L0,-10 Z" fill="none" stroke="#a371f7" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="1.5" fill="#a371f7" />
    
        </g>
    </g>
    
    <!-- Pulse Indicator -->
    <circle cx="360" cy="30" r="3" fill="#a371f7">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="30" r="6" fill="none" stroke="#a371f7" stroke-width="1">
        <animate attributeName="r" values="3;10;3" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Headers -->
    <g transform="translate(80, 36)">
        <text font-weight="700" font-size="16" fill="#ffffff" letter-spacing="-0.3px">NullTrace</text>
        <text y="20" font-weight="500" font-size="11" fill="#8b949e">AI-Powered Feedback Analytics</text>
    </g>
    
    <!-- Description -->
    <g transform="translate(20, 88)">
      <text font-weight="400" font-size="12.5" fill="#c9d1d9" line-height="1.5">
        <tspan x="0" y="0">An opinion & feedback analytics engine engineered with JWT auth,</tspan><tspan x="0" y="20">granular role-based access control, and real-time statistics.</tspan><tspan x="0" y="40">Deployed as containerized microservices on Azure infrastructure.</tspan>
      </text>
    </g>
    
    <!-- Badges -->
    <g transform="translate(20, 145)">
        
        <g transform="translate(0, 0)">
            <rect width="44" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
            <text x="22.0" y="15" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#c9d1d9" text-anchor="middle">Flask</text>
        </g>
        
        <g transform="translate(50, 0)">
            <rect width="56" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
            <text x="28.0" y="15" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#c9d1d9" text-anchor="middle">Next.js</text>
        </g>
        
        <g transform="translate(112, 0)">
            <rect width="74" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
            <text x="37.0" y="15" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#c9d1d9" text-anchor="middle">PostgreSQL</text>
        </g>
        
        <g transform="translate(192, 0)">
            <rect width="50" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
            <text x="25.0" y="15" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#c9d1d9" text-anchor="middle">Docker</text>
        </g>
        
        <g transform="translate(248, 0)">
            <rect width="44" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
            <text x="22.0" y="15" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#c9d1d9" text-anchor="middle">Azure</text>
        </g>
        
    </g>
</svg>